# Release workflow (macOS + Linux desktop + CLI)
#
# Builds and publishes Electron desktop artifacts via GitHub Releases.
# electron-updater reads latest-mac.yml from the release assets to deliver
# auto-updates.
#
# Trigger: push a vX.Y.Z tag matching both package versions on main, or
# GitHub Actions UI → "Run workflow" → pick bump type.
# Or CLI:  gh workflow run release.yml -f bump=patch
#          gh workflow run release.yml -f bump=minor
#          gh workflow run release.yml -f bump=patch -f dry_run=true
#
# Required GitHub Secrets:
#   APPLE_CERTIFICATE                  — Base64-encoded .p12 Developer ID Application certificate
#   APPLE_CERTIFICATE_PASSWORD         — Password for the .p12 file
#   APPLE_API_KEY                      — App Store Connect API key (.p8 file contents)
#   APPLE_API_KEY_ID                   — Key ID from App Store Connect
#   APPLE_API_ISSUER                   — Issuer ID from App Store Connect
#
# Optional GitHub Secrets:
#   SENTRY_AUTH_TOKEN                  — Sentry auth token for source map upload
#
# CLI publishing uses npm Trusted Publishing (no npm token secret).
# Connect npm package deus-machine to GitHub owner zvadaadam, repository
# deus-machine, workflow release.yml, with direct publishing allowed.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (build only, skip GitHub Release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  BUN_VERSION: 1.2.19

jobs:
  # ── Step 1: Validate version & bump files ───────────────────────────
  validate-and-bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Ensure release source is on main
        if: ${{ !inputs.dry_run }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            git merge-base --is-ancestor HEAD origin/main || {
              echo "::error::Release tag must point to a commit on main"
              exit 1
            }
          elif [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release must be triggered from main, got: $GITHUB_REF"
            exit 1
          fi

      - name: Resolve release version
        id: validate
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          CURRENT=$(jq -r '.version' package.json)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
               [[ "$VERSION" != "$CURRENT" ]] ||
               [[ "$VERSION" != "$(jq -r '.version' apps/cli/package.json)" ]]; then
              echo "::error::Release tag must be vX.Y.Z and match both package versions"
              exit 1
            fi
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              patch) PATCH=$((PATCH + 1)) ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              *) echo "::error::Unknown version bump: $BUMP"; exit 1 ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            TAG="v${VERSION}"

            if [[ "$DRY_RUN" != "true" ]] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists on remote"
              exit 1
            fi
          fi
          echo "Release: $TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun version pin
        run: |
          package_manager="$(sed -nE 's/.*"packageManager": "bun@([^"]+)".*/\1/p' package.json)"
          if [[ "$package_manager" != "$BUN_VERSION" ]]; then
            echo "::error::release workflow BUN_VERSION=$BUN_VERSION but package.json packageManager=bun@$package_manager"
            exit 1
          fi

      - name: Bump version, commit & create tag
        if: ${{ github.ref_type != 'tag' && !inputs.dry_run }}
        run: |
          bash scripts/bump-version.sh "${{ steps.validate.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json apps/cli/package.json
          git commit -m "release: v${{ steps.validate.outputs.version }}"
          git tag "${{ steps.validate.outputs.tag }}"
          # GITHUB_TOKEN pushes do not trigger another workflow run. This run
          # continues with the tag; a maintainer's tag push uses the same jobs.
          git push --atomic origin HEAD:main "${{ steps.validate.outputs.tag }}"

  # ── Step 2a: Build macOS (arm64 + x64), sign, notarize ─────────────
  build-macos:
    needs: validate-and-bump
    runs-on: macos-14
    timeout-minutes: 45
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ !inputs.dry_run && needs.validate-and-bump.outputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun version pin
        run: |
          package_manager="$(sed -nE 's/.*"packageManager": "bun@([^"]+)".*/\1/p' package.json)"
          if [[ "$package_manager" != "$BUN_VERSION" ]]; then
            echo "::error::release workflow BUN_VERSION=$BUN_VERSION but package.json packageManager=bun@$package_manager"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck runtime surfaces
        run: |
          bun run typecheck
          bun run typecheck:backend
          bun run typecheck:agent-server

      - name: Build all
        run: bun run build:all

      - name: Smoke test staged native runtime
        run: bun run smoke:runtime-native

      - name: Smoke test packaged runtime resources
        run: bun run smoke:runtime-resources

      - name: Prepare Apple API key for notarization
        run: |
          if [[ -z "$APPLE_API_KEY" || -z "$APPLE_API_KEY_ID" || -z "$APPLE_API_ISSUER" ]]; then
            echo "::error::APPLE_API_KEY, APPLE_API_KEY_ID, and APPLE_API_ISSUER secrets must be set"
            exit 1
          fi
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY" > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package macOS (arm64 + x64)
        run: bunx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Notarize macOS distribution artifacts
        run: |
          set -euo pipefail

          # electron-builder's notarize:true only covers the .app bundle.
          # DMG/ZIP wrappers must be submitted separately so Gatekeeper
          # trusts them and `xcrun stapler validate` passes.
          for artifact in dist-electron/*.dmg dist-electron/*.zip; do
            [ -f "$artifact" ] || continue
            echo "Submitting ${artifact} for notarization..."
            xcrun notarytool submit "$artifact" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
          done

          # Staple tickets to DMGs (ZIPs cannot be stapled; Gatekeeper
          # checks online for those)
          for dmg in dist-electron/*.dmg; do
            [ -f "$dmg" ] || continue
            echo "Stapling ticket to ${dmg}..."
            xcrun stapler staple "$dmg"
          done
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify macOS artifacts
        run: |
          set -euo pipefail

          found_resources=0
          while IFS= read -r resources_dir; do
            found_resources=1
            echo "Verifying packaged simulator helpers in $resources_dir"
            test -x "$resources_dir/simulator/simbridge"
            test -f "$resources_dir/simulator/siminspector.dylib"
            lipo "$resources_dir/simulator/simbridge" -verify_arch arm64 x86_64
            lipo "$resources_dir/simulator/siminspector.dylib" -verify_arch arm64 x86_64
          done < <(find dist-electron -maxdepth 4 -path '*/Deus.app/Contents/Resources' -type d | sort)
          if [[ "$found_resources" -ne 1 ]]; then
            echo "::error::No packaged Deus.app Resources directory found for simulator helper verification"
            exit 1
          fi

          while IFS= read -r app_path; do
            echo "Verifying signature for $app_path"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            bun run smoke:packaged-app -- --app "$app_path" --require-gatekeeper
          done < <(find dist-electron -maxdepth 2 -path '*/Deus.app' -type d | sort)

          while IFS= read -r dmg_path; do
            echo "Validating notarization for $dmg_path"
            xcrun stapler validate "$dmg_path"
          done < <(find dist-electron -maxdepth 1 -name '*.dmg' -type f | sort)

          bun run smoke:packaged-dmgs -- \
            --require-gatekeeper \
            $(find dist-electron -maxdepth 1 -name '*.dmg' -type f | sort)

      - name: Smoke test packaged runtime and desktop from DMG copy
        run: |
          set -euo pipefail

          runner_arch="$(uname -m)"
          case "$runner_arch" in
            arm64)
              dmg_path="$(find dist-electron -maxdepth 1 -name '*arm64.dmg' -type f | head -n 1)"
              ;;
            x86_64)
              dmg_path="$(find dist-electron -maxdepth 1 \( -name '*x64.dmg' -o \( -name '*.dmg' ! -name '*arm64.dmg' \) \) -type f | head -n 1)"
              ;;
            *)
              echo "::error::Unsupported macOS runner architecture: ${runner_arch}"
              exit 1
              ;;
          esac
          if [[ -z "$dmg_path" ]]; then
            echo "::error::No macOS DMG found for runner architecture ${runner_arch}"
            find dist-electron -maxdepth 1 -name '*.dmg' -type f -print
            exit 1
          fi

          mount_dir="$(mktemp -d "${RUNNER_TEMP}/deus-dmg.XXXXXX")"
          copied_root="$(mktemp -d "${RUNNER_TEMP}/deus-app.XXXXXX")"
          copied_home="$copied_root/home"
          copied_app="$copied_home/Applications/Deus.app"
          attached=0

          cleanup() {
            if [[ "$attached" -eq 1 ]]; then
              hdiutil detach "$mount_dir" -quiet || true
            fi
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -mountpoint "$mount_dir" -nobrowse
          attached=1
          mkdir -p "$(dirname "$copied_app")"
          ditto "$mount_dir/Deus.app" "$copied_app"
          hdiutil detach "$mount_dir" -quiet
          attached=0

          app_bin="$copied_app/Contents/MacOS/Deus"
          resources_dir="$copied_app/Contents/Resources"
          test -x "$resources_dir/simulator/simbridge"
          test -f "$resources_dir/simulator/siminspector.dylib"
          test -x "$app_bin"

          bun run smoke:packaged-runtime -- \
            --app "$copied_app" \
            --require-gatekeeper

          bun run smoke:packaged-desktop -- \
            --app "$copied_app" \
            --home "$copied_home" \
            --launch-in-place \
            --require-gatekeeper

      - name: Clean up Apple API key
        if: always()
        run: rm -f "${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest-mac.yml
          if-no-files-found: error

  # ── Step 2b: Build Linux (x64) ─────────────────────────────────────
  build-linux:
    needs: validate-and-bump
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ !inputs.dry_run && needs.validate-and-bump.outputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun version pin
        run: |
          package_manager="$(sed -nE 's/.*"packageManager": "bun@([^"]+)".*/\1/p' package.json)"
          if [[ "$package_manager" != "$BUN_VERSION" ]]; then
            echo "::error::release workflow BUN_VERSION=$BUN_VERSION but package.json packageManager=bun@$package_manager"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck runtime surfaces
        run: |
          bun run typecheck
          bun run typecheck:backend
          bun run typecheck:agent-server

      - name: Package Linux (x64)
        run: |
          bun run build:all
          bun run validate:runtime
          bun run smoke:runtime-source
          bunx electron-builder --linux --publish never

      - name: Verify Linux artifacts
        run: |
          set -euo pipefail
          test -f dist-electron/Deus-*.AppImage
          test -f dist-electron/deus_*_amd64.deb
          test -x dist-electron/linux-unpacked/resources/bin/deus-runtime
          test -x dist-electron/linux-unpacked/resources/bin/codex
          test -x dist-electron/linux-unpacked/resources/bin/claude
          test -x dist-electron/linux-unpacked/resources/bin/gh
          test -x dist-electron/linux-unpacked/resources/bin/rg
          test -x dist-electron/linux-unpacked/resources/bin/agent-browser
          file dist-electron/linux-unpacked/resources/bin/deus-runtime | grep 'ELF 64-bit'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/latest-linux.yml
          if-no-files-found: error

  # ── Step 3: Stage a draft GitHub Release with all artifacts ─────────
  create-release:
    needs: [validate-and-bump, build-macos, build-linux]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o \
            -name "*.blockmap" -o -name "*.yml" \
          \) -exec cp {} release/ \;
          echo "=== Release files ==="
          ls -lh release/

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-and-bump.outputs.tag }}
          VERSION: ${{ needs.validate-and-bump.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Deus v${VERSION}" \
            --draft \
            --generate-notes \
            release/*

  # ── Step 4: Publish CLI to npm before the release becomes public ────
  publish-cli:
    needs: [validate-and-bump, create-release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-and-bump.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun version pin
        run: |
          package_manager="$(sed -nE 's/.*"packageManager": "bun@([^"]+)".*/\1/p' package.json)"
          if [[ "$package_manager" != "$BUN_VERSION" ]]; then
            echo "::error::release workflow BUN_VERSION=$BUN_VERSION but package.json packageManager=bun@$package_manager"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: |
          bun run build:runtime
          cd apps/cli && bun run build

      - name: Publish to npm
        working-directory: apps/cli
        run: |
          # Bun builds and packs; npm's publisher performs the GitHub OIDC exchange.
          # Clear setup-node's token config so publishing uses workflow identity.
          unset NODE_AUTH_TOKEN NPM_CONFIG_TOKEN NPM_CONFIG_USERCONFIG
          bun pm pack --filename "$RUNNER_TEMP/deus-machine.tgz"
          bunx --package npm@11.14.1 npm publish "$RUNNER_TEMP/deus-machine.tgz" --access public

  # ── Step 5: Publish GitHub Release after CLI publish succeeds ───────
  publish-release:
    needs: [validate-and-bump, publish-cli]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-and-bump.outputs.tag }}
        run: |
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --draft=false
