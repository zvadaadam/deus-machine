name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        # Errors block; the existing warnings do not.
        run: bun run lint

      - name: Dead code check (Knip)
        # Non-blocking while we clean up existing unused files/exports.
        # Once resolved, remove "|| true" and use --max-issues 0 to enforce.
        run: bun run knip || true

      - name: Format check (Prettier)
        run: bun run format:check

      - name: Typecheck (frontend + desktop)
        run: bun run typecheck

      - name: Typecheck (backend)
        run: bun run typecheck:backend

      - name: Typecheck (agent-server)
        run: bun run typecheck:agent-server

      - name: Typecheck & test (cloud-relay)
        run: cd apps/cloud-relay && bun install --frozen-lockfile && bunx tsc --noEmit && bunx vitest run

      - name: Test (screen-studio)
        # The renderer and pipeline tests encode real video.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          bun run test:screen-studio

  runtime-macos:
    name: Native Runtime Smoke (macOS)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test device-use
        run: cd packages/device-use && bun test

      - name: Build staged native runtime
        run: bun run build:runtime

      - name: Validate staged runtime
        run: bun run validate:runtime

      - name: Smoke source runtime contract
        run: bun run smoke:runtime-source

      - name: Smoke desktop main runtime contract
        run: bun run smoke:desktop-main-runtime

      - name: Smoke native runtime executable
        run: bun run smoke:runtime-native -- --skip-validate

      - name: Smoke packaged runtime resources
        run: bun run smoke:runtime-resources

      - name: Build Electron desktop outputs
        run: bun run build

      - name: Select macOS package architecture
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              echo "MAC_BUILDER_ARCH=arm64" >> "$GITHUB_ENV"
              echo "MAC_EXPECTED_ARCH=arm64" >> "$GITHUB_ENV"
              echo "MAC_APP_PATH=dist-electron/mac-arm64/Deus.app" >> "$GITHUB_ENV"
              ;;
            x86_64)
              echo "MAC_BUILDER_ARCH=x64" >> "$GITHUB_ENV"
              echo "MAC_EXPECTED_ARCH=x64" >> "$GITHUB_ENV"
              echo "MAC_APP_PATH=dist-electron/mac/Deus.app" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unsupported macOS runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

      - name: Package macOS app directory
        run: bun run package:mac:dir -- --arch "$MAC_BUILDER_ARCH"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke packaged macOS app bundle
        run: >
          bun run smoke:packaged-app --
          --app "$MAC_APP_PATH"
          --arch "$MAC_EXPECTED_ARCH"
          --skip-app-signature
          --run-version-checks

      - name: Smoke packaged runtime executable
        run: >
          bun run smoke:packaged-runtime --
          --app "$MAC_APP_PATH"
          --skip-app-check

      - name: Smoke packaged Electron desktop
        run: >
          bun run smoke:packaged-desktop --
          --app "$MAC_APP_PATH"
          --skip-app-check

  desktop-runtime-tests:
    name: Desktop Runtime Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild SQLite for recovery integration tests
        run: bun run native:node

      - name: Run app and desktop unit tests
        run: bun run test:simulator

      - name: Install browser for UI regression journey
        run: bunx playwright install --with-deps chromium

      - name: Verify workspace usability in desktop and mobile layouts
        run: bun test/e2e/workspace-usability.browser.mjs

      - name: Verify workspace panels and preserved tool state
        run: bun test/e2e/workspace-layout.browser.mjs

      - name: Verify shared controls with keyboard and touch
        run: bun test/e2e/controls.browser.mjs

      - name: Verify development hot reload preserves the backend connection
        run: node test/e2e/query-protocol-hmr.browser.mjs

      - name: Upload UI regression screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-usability-screenshots
          path: |
            .context/workspace-usability-ui/*.png
            .context/workspace-layout-ui/*.png
            .context/controls-ui/*.png
          if-no-files-found: ignore

  runtime-linux:
    name: Native Runtime Smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Electron desktop outputs
        run: |
          bun run build:all

      - name: Package Linux app
        run: bunx electron-builder --linux dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged Linux runtime resources
        run: |
          set -euo pipefail
          resources_dir="dist-electron/linux-unpacked/resources"
          test -x "$resources_dir/bin/deus-runtime"
          test -x "$resources_dir/bin/codex"
          test -x "$resources_dir/bin/claude"
          test -x "$resources_dir/bin/gh"
          test -x "$resources_dir/bin/rg"
          test -x "$resources_dir/bin/agent-browser"
          file "$resources_dir/bin/deus-runtime" | grep 'ELF 64-bit'

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild better-sqlite3 for Node.js
        # bun install compiles native modules for Bun's ABI, but vitest runs
        # under Node.js which has a different NODE_MODULE_VERSION. Rebuild
        # better-sqlite3 specifically for the Node.js version used in CI.
        run: cd node_modules/better-sqlite3 && bunx node-gyp rebuild

      - name: Run tests
        run: bun run test:backend

  agent-server-tests:
    name: Agent Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run agent-server unit tests
        run: bun run test:agent-server:unit

      - name: Build agent-server bundle
        run: bun run build:agent-server

      - name: Run agent-server E2E tests
        run: bun run test:agent-server:e2e
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
