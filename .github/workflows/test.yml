name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        # Errors block; the existing warnings do not.
        run: bun run lint

      - name: Dead code check (Knip)
        # Unused files, unused or undeclared dependencies and unresolved imports
        # block. Unused exports are reported as warnings and do not.
        run: bun run knip

      - name: Format check (Prettier)
        run: bun run format:check

      - name: Typecheck (frontend + desktop)
        run: bun run typecheck

      - name: Typecheck (backend)
        run: bun run typecheck:backend

      - name: Typecheck (agent-server)
        run: bun run typecheck:agent-server

      - name: Typecheck & test (cloud-relay)
        run: cd apps/cloud-relay && bun install --frozen-lockfile && bunx tsc --noEmit && bunx vitest run

      - name: Test (screen-studio)
        # The renderer and pipeline tests encode real video.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          bun run test:screen-studio

  runtime-macos:
    name: Native Runtime Smoke (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build staged native runtime
        run: bun run build:runtime

      - name: Build Electron desktop outputs
        run: bun run build
        # The macOS runners have 7 GB: Node's default heap runs out building the app.
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Select macOS package architecture
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              echo "MAC_BUILDER_ARCH=arm64" >> "$GITHUB_ENV"
              echo "MAC_APP_PATH=dist-electron/mac-arm64/Deus.app" >> "$GITHUB_ENV"
              ;;
            x86_64)
              echo "MAC_BUILDER_ARCH=x64" >> "$GITHUB_ENV"
              echo "MAC_APP_PATH=dist-electron/mac/Deus.app" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unsupported macOS runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

      - name: Package macOS app directory
        run: bun run package:mac:dir -- --arch "$MAC_BUILDER_ARCH"

      - name: Smoke packaged runtime executable
        run: bun run smoke:packaged-runtime -- --app "$MAC_APP_PATH"

      - name: Smoke packaged Electron desktop
        run: bun run smoke:packaged-desktop -- --app "$MAC_APP_PATH"

      - name: Smoke the npm CLI package on macOS
        # Code that runs only on macOS (the backend's engine start) is not
        # covered by the Linux run; `build:runtime` above built the backend bundle.
        run: bun run smoke:cli-package

  desktop-runtime-tests:
    name: Desktop Runtime Unit Tests
    # Playwright's Chromium does not support ubuntu-latest's 26.04 yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild SQLite for recovery integration tests
        run: bun run native:node

      - name: Test standalone runtime client
        run: bun run test:runtime-client

      - name: Run app and desktop unit tests
        run: bun run test:app

      - name: Install browser for UI regression journey
        run: bunx playwright install --with-deps chromium

      - name: Verify workspace usability in desktop and mobile layouts
        run: bun test/e2e/workspace-usability.browser.mjs

      - name: Verify workspace panels and preserved tool state
        run: bun test/e2e/workspace-layout.browser.mjs

      - name: Verify shared controls with keyboard and touch
        run: bun test/e2e/controls.browser.mjs

      - name: Verify cloud provider accounts in settings
        run: bun test/e2e/provider-accounts.browser.mjs

      - name: Verify the composer's picker for agent, model and thinking
        run: bun test/e2e/model-picker.browser.mjs

      - name: Verify development hot reload preserves the backend connection
        run: node test/e2e/query-protocol-hmr.browser.mjs

      - name: Upload UI regression screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-usability-screenshots
          path: |
            .context/workspace-usability-ui/*.png
            .context/workspace-layout-ui/*.png
            .context/controls-ui/*.png
          if-no-files-found: ignore

  runtime-linux:
    name: Native Runtime Smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Electron desktop outputs
        run: |
          bun run build:all

      - name: Package Linux app
        run: bunx electron-builder --linux dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke packaged Linux runtime
        # afterPack already checked every bundled executable is an x86-64 ELF;
        # this runs each, then the runtime's self-test and backend.
        run: bun run smoke:packaged-runtime -- --app dist-electron/linux-unpacked/resources

      - name: Smoke the npm CLI package
        # `build:all` above ran `build:runtime`, the release's first step. This
        # builds and packs the CLI as the release does, installs the tarball
        # with npm and runs `deus --version`.
        run: bun run smoke:cli-package

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build node-pty for Node.js
        # node-pty ships no Linux prebuild, and pty-parity opens real
        # terminals. test:backend rebuilds better-sqlite3 itself (native:node).
        run: cd node_modules/node-pty && bunx node-gyp rebuild

      - name: Run tests
        run: bun run test:backend

      - name: SQLite and terminal parity on Bun (the packaged app's engine)
        # The same files test:backend just ran on Node (better-sqlite3,
        # node-pty), run by Bun's test runner against bun:sqlite and Bun's terminal.
        run: bun run test:bun

  agent-server-tests:
    name: Agent Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run agent-server tests (the engine in process, real agents opt-in)
        run: bun run test:agent-server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
