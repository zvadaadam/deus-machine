appId: com.deus.app
productName: Deus
directories:
  buildResources: resources
  output: dist-electron
electronLanguages: [en]
npmRebuild: false
beforePack: "scripts/runtime/electron-builder-before-pack.cjs"
afterPack: "scripts/runtime/electron-builder-after-pack.cjs"
afterSign: "scripts/verify-packaged-agent-clis.cjs"
files:
  - "out/**/*"
  - "resources/**/*"
  - "!apps/**/*"
  - "!node_modules/device-use/native/.build/**"
  - "!node_modules/device-use/native/.swiftpm/**"
  # The packaged runtime owns native agent/browser CLIs in Resources/bin.
  # Keep SDK libraries, but do not also ship their npm native executable payloads.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-linux-*/**"
  - "!node_modules/@anthropic-ai/claude-agent-sdk-win32-*/**"
  - "!node_modules/@openai/codex/bin/**"
  - "!node_modules/@openai/codex/vendor/**"
  - "!node_modules/@openai/codex-darwin-*/**"
  - "!node_modules/@openai/codex-linux-*/**"
  - "!node_modules/@openai/codex-win32-*/**"
  - "!node_modules/agent-browser/**"
  - "!node_modules/@sentry/cli/**"
  - "!node_modules/@sentry/cli-*/**"
asarUnpack:
  - "resources/**"
  - "node_modules/better-sqlite3/**"
  - "node_modules/node-pty/**"
  - "node_modules/@napi-rs/canvas/**"
  - "node_modules/@napi-rs/canvas-*/**"
mac:
  category: public.app-category.developer-tools
  binaries:
    - "Contents/Resources/bin/deus-runtime"
    - "Contents/Resources/bin/codex-runtime/bin/codex"
    - "Contents/Resources/bin/codex-runtime/bin/codex-code-mode-host"
    - "Contents/Resources/bin/codex-runtime/codex-resources/zsh/bin/zsh"
    - "Contents/Resources/bin/claude"
    - "Contents/Resources/bin/gh"
    - "Contents/Resources/bin/codex-runtime/codex-path/rg"
    - "Contents/Resources/bin/agent-browser"
    - "Contents/Resources/simulator/simbridge"
    - "Contents/Resources/simulator/siminspector.dylib"
  extraResources:
    - from: "dist/runtime/electron/bin/deus-runtime.json"
      to: "bin/deus-runtime.json"
    - from: "dist/runtime/electron/bin/agent-clis.json"
      to: "bin/agent-clis.json"
    - from: "dist/runtime/electron/bin/gh-cli.json"
      to: "bin/gh-cli.json"
    - from: "dist/runtime/electron/bin/darwin-${arch}"
      to: "bin"
      filter: ["gh", "deus-runtime", "codex", "codex-runtime/**/*", "claude", "rg", "agent-browser"]
    - from: "packages/device-use/bin/simbridge"
      to: "simulator/simbridge"
    - from: "packages/device-use/bin/siminspector.dylib"
      to: "simulator/siminspector.dylib"
    - from: "packages/device-use"
      to: "agentic-apps/device-use"
      filter:
        - "agentic-app.json"
        - "package.json"
        - "dist/**/*"
        - "skills/**/*"
        - "bin/**/*"
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  additionalArguments:
    - "--pagesize"
    - "4096"
  darkModeSupport: true
  icon: resources/icons/icon.icns
  notarize: true
dmg:
  # Auto-updates use ZIPs. DMGs are stapled after packaging, so their earlier
  # hashes and blockmaps would be stale; retain them only as manual installers.
  writeUpdateInfo: false
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  icon: resources/icons/icon.png
  extraResources:
    - from: "dist/runtime/electron/bin/deus-runtime.json"
      to: "bin/deus-runtime.json"
    - from: "dist/runtime/electron/bin/agent-clis.json"
      to: "bin/agent-clis.json"
    - from: "dist/runtime/electron/bin/gh-cli.json"
      to: "bin/gh-cli.json"
    - from: "dist/runtime/electron/bin/linux-${arch}"
      to: "bin"
      filter: ["gh", "deus-runtime", "codex", "codex-runtime/**/*", "claude", "rg", "agent-browser"]
publish:
  provider: github
  releaseType: release
