appId: com.deus.app
productName: Deus
protocols:
  - name: Deus workspace
    schemes: [deus]
directories:
  buildResources: resources
  output: dist-electron
electronLanguages: [en]
npmRebuild: false
afterPack: "scripts/runtime/electron-builder-after-pack.cjs"
afterSign: "scripts/runtime/electron-builder-after-sign.cjs"
files:
  - "out/**/*"
  # Renderer/main source maps are "hidden" (unreferenced); shipping them only adds size.
  - "!out/**/*.map"
  - "resources/**/*"
  # Main and preload bundle what they import, and deus-runtime is compiled with
  # everything but the canvas, which it loads from app.asar.unpacked
  # (DEUS_NATIVE_MODULES). electron-builder applies only the exclusions here
  # to node_modules, so the allowlist is one.
  - "!node_modules/!(@napi-rs)/**"
# The installed app runs only its own app.asar, as checked against the hash in
# its signed Info.plist, and nothing can run it as Node, pass Node flags or open
# an inspector. The packaged backend is deus-runtime, never Electron as Node.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # The window is served from app://deus, never file://.
  grantFileProtocolExtraPrivileges: false
asarUnpack:
  - "resources/**"
  - "node_modules/@napi-rs/canvas/**"
  - "node_modules/@napi-rs/canvas-*/**"
mac:
  category: public.app-category.developer-tools
  # Ship vendor-signed CLIs as received. Keychain recognizes Codex by OpenAI's signature.
  # Deus signs CLIs that arrive unsigned or ad hoc.
  signIgnore:
    - "/Contents/Resources/bin/(claude|codex|gh|rg)$"
    - "/Contents/Resources/bin/codex-runtime/"
  binaries:
    - "Contents/Resources/bin/deus-runtime"
    - "Contents/Resources/bin/agent-browser"
  extraResources:
    # The app file collector excludes bun.lock even under asarUnpack.
    - from: "resources/device-hub/bun.lock"
      to: "app.asar.unpacked/resources/device-hub/bun.lock"
    - from: "dist/runtime/electron/bin/darwin-${arch}"
      to: "bin"
      filter:
        - "gh"
        - "deus-runtime"
        - "codex"
        - "codex-runtime/**/*"
        - "claude"
        - "rg"
        - "agent-browser"
        - "agent-device"
        - "agent-device-package/**/*"
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  additionalArguments:
    - "--pagesize"
    - "4096"
  darkModeSupport: true
  icon: resources/icons/icon.icns
  notarize: true
dmg:
  # Auto-updates use ZIPs. DMGs are stapled after packaging, so their earlier
  # hashes and blockmaps would be stale; retain them only as manual installers.
  writeUpdateInfo: false
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  icon: resources/icons/icon.png
  extraResources:
    - from: "dist/runtime/electron/bin/linux-${arch}"
      to: "bin"
      filter:
        - "gh"
        - "deus-runtime"
        - "codex"
        - "codex-runtime/**/*"
        - "claude"
        - "rg"
        - "agent-browser"
        - "agent-device"
        - "agent-device-package/**/*"
publish:
  provider: github
  releaseType: release
