# Deploy cloud services to Cloudflare.
# Main deploys relay and landing changes. Release deploys the tagged web app.
#
# Services:
#   relay   — Cloudflare Worker (relay.deusmachine.ai)
#   web     — Cloudflare Pages (the deus web app; served at deusmachine.ai via
#             the landing worker's edge router, app.deusmachine.ai = 301 alias)
#   landing — Cloudflare Worker (deusmachine.ai: landing + root edge router)
#
# Required GitHub Secrets:
#   CLOUDFLARE_API_TOKEN     — Cloudflare API token with Workers/Pages deploy permissions
#   CLOUDFLARE_ACCOUNT_ID    — Cloudflare account ID

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/cloud-relay/**"
      - "apps/landing/**"
      - "shared/types/relay.ts"
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      ref:
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options:
          - relay
          - web
          - landing
      ref:
        description: "Release tag for web (vX.Y.Z). Relay and landing use the branch or tag selected for the run."
        type: string

# Every job only builds and pushes to Cloudflare (via CLOUDFLARE_API_TOKEN);
# the GITHUB_TOKEN never needs write access.
permissions:
  contents: read

jobs:
  # ── Detect which services changed (for push events) ──────────────
  changes:
    name: Detect Changes
    if: ${{ !inputs.service }}
    runs-on: ubuntu-latest
    outputs:
      relay: ${{ steps.filter.outputs.relay }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relay:
              - 'apps/cloud-relay/**'
              - 'shared/types/relay.ts'
            landing:
              - 'apps/landing/**'

  # ── Deploy Cloud Relay (Cloudflare Worker) ───────────────────────
  deploy-relay:
    name: Deploy Cloud Relay
    needs: changes
    runs-on: ubuntu-latest
    concurrency: deploy-relay
    if: >-
      !cancelled() &&
      (inputs.service == 'relay' || needs.changes.outputs.relay == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install relay dependencies
        run: cd apps/cloud-relay && bun install --frozen-lockfile

      - name: Typecheck relay
        run: cd apps/cloud-relay && bunx tsc --noEmit

      - name: Deploy relay to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/cloud-relay
          command: deploy

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -sf https://relay.deusmachine.ai/health | jq -r '.status')
          if [ "$STATUS" != "ok" ]; then
            echo "::warning::Health check returned status: $STATUS"
          else
            echo "Relay health check passed"
          fi

  # ── Deploy Web App (Cloudflare Pages) ────────────────────────────
  deploy-web:
    name: Deploy Web App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: deploy-web
    if: inputs.service == 'web'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        # The production web app is the fully Mac-closed (web-direct) build:
        # cloud sessions straight against agnt from the browser. Relay entry
        # paths (/connect*, /s/*) keep their relay behavior on the same build.
        run: bun run build:web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist/web --project-name=deus --branch=main

  # ── Deploy Landing + Root Edge Router (Cloudflare Worker) ────────
  # When the router and web asset paths both change, ship them in two releases, web first,
  # so the router can still serve the published app's scripts.
  deploy-landing:
    name: Deploy Landing
    needs: changes
    runs-on: ubuntu-latest
    concurrency: deploy-landing
    if: >-
      !cancelled() &&
      (inputs.service == 'landing' || needs.changes.outputs.landing == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install landing dependencies
        run: cd apps/landing && bun install --frozen-lockfile

      - name: Build landing (includes the root edge router)
        run: cd apps/landing && bun run build

      - name: Deploy landing to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/landing
          command: deploy
