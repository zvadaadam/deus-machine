name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v4
      - &node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - &bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - &install
        name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Install relay dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/cloud-relay
      - name: Install FFmpeg and ffprobe
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO --retry 3 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/{ffmpeg,ffprobe}-linux-x64.gz'
          echo 'bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  ffmpeg-linux-x64.gz' | sha256sum -c -
          echo '25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067  ffprobe-linux-x64.gz' | sha256sum -c -
          for bin in ffmpeg ffprobe; do
            gunzip "$bin-linux-x64.gz"
            sudo install "$bin-linux-x64" "/usr/local/bin/$bin"
          done
      - run: bun run check quality

  app:
    name: App Unit Tests & Browser Controls
    # Playwright's Chromium does not support ubuntu-latest's 26.04 yet.
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *node
      - *bun
      - *install
      - &chromium
        name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - run: bun run check app
      - name: Upload UI regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-usability-screenshots
          path: |
            .context/workspace-usability-ui/*.png
            .context/workspace-layout-ui/*.png
            .context/controls-ui/*.png
          if-no-files-found: ignore

  journeys:
    name: Workspace Journeys
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *node
      - *bun
      - *install
      - *chromium
      - run: bun run check journeys

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *node
      - *bun
      - *install
      # node-pty ships no Linux prebuild, and pty-parity opens real terminals.
      - name: Build node-pty
        run: bunx node-gyp rebuild
        working-directory: node_modules/node-pty
      - run: bun run check backend

  agent-server:
    name: Agent Server Tests
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *node
      - *bun
      - *install
      - run: bun run check agent-server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  runtime-macos:
    name: Native Runtime Smoke (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - *checkout
      - *node
      - *bun
      - *install
      - run: bun run check runtime-macos
        env:
          # The macOS runners have 7 GB: Node's default heap runs out building the app.
          NODE_OPTIONS: --max-old-space-size=6144

  runtime-linux:
    name: Native Runtime Smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - *checkout
      - *node
      - *bun
      - *install
      - run: bun run check runtime-linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
