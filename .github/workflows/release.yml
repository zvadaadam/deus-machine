# Release workflow (macOS and Linux desktop, npm CLI and hosted web)
#
# Publishes Electron artifacts and the npm CLI, then deploys the tagged web app.
# electron-updater reads latest-mac.yml from the release assets to deliver
# auto-updates.
#
# Trigger: push a vX.Y.Z tag matching both package versions on main, or
# GitHub Actions UI → "Run workflow" → pick bump type.
# Or CLI:  gh workflow run release.yml -f bump=patch
#          gh workflow run release.yml -f bump=minor
#          gh workflow run release.yml -f bump=patch -f dry_run=true
#
# Required GitHub secrets. Apple signing uses Cognitic s.r.o.'s team (V3MA6M9H6Q),
# the same Developer ID and notarization account as the Rafina app (docs/releases.md).
#   APPLE_CERT_P12                     — Base64-encoded .p12 of the Developer ID Application identity
#   APPLE_CERT_PASSWORD                — Password for the .p12
#   APPLE_ID                           — Apple Account that notarizes, a member of the team
#   APPLE_APP_SPECIFIC_PASSWORD        — App-specific password of that account
#   APPLE_TEAM_ID                      — The team's id
#   CLOUDFLARE_API_TOKEN               — Deploys the hosted web to Cloudflare Pages
#   CLOUDFLARE_ACCOUNT_ID              — Cloudflare account hosting the web app
#
# Optional GitHub Secrets:
#   SENTRY_AUTH_TOKEN                  — Sentry auth token for source map upload
#
# CLI publishing uses npm Trusted Publishing (no npm token secret).
# Connect npm package deus-machine to GitHub owner zvadaadam, repository
# deus-machine, workflow release.yml, with direct publishing allowed.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (build only, skip GitHub Release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read # validate-and-bump reads the Tests workflow's runs

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # ── Step 1: Validate version & bump files ───────────────────────────
  validate-and-bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Nothing here runs the tests: a release ships only a commit the Tests
      # workflow (test.yml) has already passed. A dry run only warns.
      - name: Require passing Tests for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          SHA="$(git rev-parse HEAD)"
          PASSED="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.total_count')"
          if [[ "$PASSED" -ge 1 ]]; then
            echo "Tests passed for $SHA"
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "::warning::The Tests workflow has no successful run for $SHA; a real release of this commit would stop here."
          else
            echo "::error::The Tests workflow (test.yml) has no completed, successful run for $SHA, the commit being released. Wait for it to pass (or re-run it) and start the release again."
            exit 1
          fi

      - name: Ensure release source is on main
        if: ${{ !inputs.dry_run }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            git merge-base --is-ancestor HEAD origin/main || {
              echo "::error::Release tag must point to a commit on main"
              exit 1
            }
          elif [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release must be triggered from main, got: $GITHUB_REF"
            exit 1
          fi

      - name: Resolve release version
        id: validate
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          CURRENT=$(jq -r '.version' package.json)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
               [[ "$VERSION" != "$CURRENT" ]] ||
               [[ "$VERSION" != "$(jq -r '.version' apps/cli/package.json)" ]]; then
              echo "::error::Release tag must be vX.Y.Z and match both package versions"
              exit 1
            fi
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              patch) PATCH=$((PATCH + 1)) ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              *) echo "::error::Unknown version bump: $BUMP"; exit 1 ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            TAG="v${VERSION}"

            if [[ "$DRY_RUN" != "true" ]] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists on remote"
              exit 1
            fi
          fi
          echo "Release: $TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Bump version, commit & create tag
        if: ${{ github.ref_type != 'tag' && !inputs.dry_run }}
        run: |
          bash scripts/bump-version.sh "${{ steps.validate.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json apps/cli/package.json
          git commit -m "release: v${{ steps.validate.outputs.version }}"
          git tag "${{ steps.validate.outputs.tag }}"
          # GITHUB_TOKEN pushes do not trigger another workflow run. This run
          # continues with the tag; a maintainer's tag push uses the same jobs.
          git push --atomic origin HEAD:main "${{ steps.validate.outputs.tag }}"

  # ── Step 2a: Build macOS (arm64 + x64), sign, notarize ─────────────
  build-macos:
    needs: validate-and-bump
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ !inputs.dry_run && needs.validate-and-bump.outputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all
        run: bun run build:all
        # The macOS runners have 7 GB: Node's default heap runs out building the app.
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # electron-builder skips notarization without a word when it has no
      # credentials, so a missing secret stops the release here instead.
      - name: Require Apple signing and notarization secrets
        run: |
          for name in APPLE_CERT_P12 APPLE_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The $name secret must be set"
              exit 1
            fi
          done
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package macOS (arm64 + x64)
        run: bunx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.APPLE_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize macOS distribution artifacts
        run: |
          set -euo pipefail

          dmgs=(dist-electron/*.dmg)
          if [[ ${#dmgs[@]} != 2 ]]; then
            echo "::error::Expected the arm64 and x64 DMGs"
            exit 1
          fi
          auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
          ids=()
          for dmg in "${dmgs[@]}"; do
            echo "Submitting $dmg"
            response=$(xcrun notarytool submit "$dmg" "${auth[@]}" --output-format json) || { echo "$response"; exit 1; }
            echo "$response"
            id=$(jq -er '.id' <<< "$response")
            ids+=("$id")
          done

          failed=0
          for id in "${ids[@]}"; do
            if ! xcrun notarytool wait "$id" "${auth[@]}" --output-format json --timeout 10m | jq -e 'select(.status == "Accepted")'; then
              failed=1
              xcrun notarytool log "$id" "${auth[@]}" || true
            fi
          done
          if [[ "$failed" != 0 ]]; then exit 1; fi
          for dmg in "${dmgs[@]}"; do
            xcrun stapler staple "$dmg"
          done
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # afterPack checked each app's layout (every executable built for its
      # architecture) and afterSign the
      # runtime's signature; this checks what notarization decides, for both.
      - name: Verify macOS artifacts
        run: |
          set -euo pipefail

          zips=(dist-electron/*.zip)
          if [[ ${#zips[@]} != 2 ]]; then
            echo "::error::Expected the arm64 and x64 updater ZIPs"
            exit 1
          fi
          for zip in "${zips[@]}"; do
            unpacked="$(mktemp -d)"
            ditto -x -k "$zip" "$unpacked"
            app_path="$unpacked/Deus.app"
            echo "Verifying signature, ticket and Gatekeeper for $zip"
            xcrun stapler validate "$app_path"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            # Keychain recognizes Codex by OpenAI's signature.
            codesign --verify --strict -R='identifier codex and anchor apple generic and certificate leaf[subject.OU] = "2DC432GLL2"' "$app_path/Contents/Resources/bin/codex"
            spctl --assess --type execute --verbose=4 "$app_path"
            rm -rf "$unpacked"
          done

          while IFS= read -r dmg_path; do
            echo "Validating notarization for $dmg_path"
            xcrun stapler validate "$dmg_path"
          done < <(find dist-electron -maxdepth 1 -name '*.dmg' -type f | sort)

      - name: Smoke test packaged runtime and desktop from DMG copy
        run: |
          set -euo pipefail

          runner_arch="$(uname -m)"
          case "$runner_arch" in
            arm64)
              dmg_path="$(find dist-electron -maxdepth 1 -name '*arm64.dmg' -type f | head -n 1)"
              ;;
            x86_64)
              dmg_path="$(find dist-electron -maxdepth 1 \( -name '*x64.dmg' -o \( -name '*.dmg' ! -name '*arm64.dmg' \) \) -type f | head -n 1)"
              ;;
            *)
              echo "::error::Unsupported macOS runner architecture: ${runner_arch}"
              exit 1
              ;;
          esac
          if [[ -z "$dmg_path" ]]; then
            echo "::error::No macOS DMG found for runner architecture ${runner_arch}"
            find dist-electron -maxdepth 1 -name '*.dmg' -type f -print
            exit 1
          fi

          mount_dir="$(mktemp -d "${RUNNER_TEMP}/deus-dmg.XXXXXX")"
          copied_root="$(mktemp -d "${RUNNER_TEMP}/deus-app.XXXXXX")"
          copied_home="$copied_root/home"
          copied_app="$copied_home/Applications/Deus.app"
          attached=0

          cleanup() {
            if [[ "$attached" -eq 1 ]]; then
              hdiutil detach "$mount_dir" -quiet || true
            fi
          }
          trap cleanup EXIT

          hdiutil attach "$dmg_path" -mountpoint "$mount_dir" -nobrowse
          attached=1
          mkdir -p "$(dirname "$copied_app")"
          ditto "$mount_dir/Deus.app" "$copied_app"
          hdiutil detach "$mount_dir" -quiet
          attached=0

          bun run smoke:packaged-runtime -- --app "$copied_app"

          bun run smoke:packaged-desktop -- \
            --app "$copied_app" \
            --home "$copied_home" \
            --launch-in-place \
            --require-gatekeeper

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest-mac.yml
          if-no-files-found: error

  # ── Step 2b: Build Linux (x64) ─────────────────────────────────────
  build-linux:
    needs: validate-and-bump
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ !inputs.dry_run && needs.validate-and-bump.outputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package Linux (x64)
        run: |
          bun run build:all
          bunx electron-builder --linux --publish never

      - name: Verify Linux artifacts
        # afterPack checked every bundled executable in linux-unpacked; the
        # smoke runs each, then the runtime's self-test and backend.
        run: |
          set -euo pipefail
          test -f dist-electron/Deus-*.AppImage
          test -f dist-electron/deus_*_amd64.deb
          bun run smoke:packaged-runtime -- --app dist-electron/linux-unpacked/resources

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/latest-linux.yml
          if-no-files-found: error

  # ── Step 3: Stage a draft GitHub Release with all artifacts ─────────
  create-release:
    needs: [validate-and-bump, build-macos, build-linux]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o \
            -name "*.blockmap" -o -name "*.yml" \
          \) -exec cp {} release/ \;
          echo "=== Release files ==="
          ls -lh release/

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-and-bump.outputs.tag }}
          VERSION: ${{ needs.validate-and-bump.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Deus v${VERSION}" \
            --draft \
            --generate-notes \
            release/*

  # ── Step 4: Publish CLI to npm before the release becomes public ────
  publish-cli:
    needs: [validate-and-bump, create-release]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-and-bump.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run build:runtime

      - name: Build, pack and smoke CLI
        # Builds apps/cli, packs it, installs the tarball into an empty
        # directory with npm and requires `deus --version` to print the version.
        run: bun run smoke:cli-package -- --tarball "$RUNNER_TEMP/deus-machine.tgz"

      - name: Publish to npm
        working-directory: apps/cli
        run: |
          # Bun builds and packs; npm's publisher performs the GitHub OIDC exchange.
          # Clear setup-node's token config so publishing uses workflow identity.
          # The tarball is the one the smoke installed and ran.
          unset NODE_AUTH_TOKEN NPM_CONFIG_TOKEN NPM_CONFIG_USERCONFIG
          bunx npm@11.14.1 publish "$RUNNER_TEMP/deus-machine.tgz" --access public

  # ── Step 5: Publish GitHub Release after CLI publish succeeds ───────
  publish-release:
    needs: [validate-and-bump, publish-cli]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate-and-bump.outputs.tag }}
        run: |
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --draft=false

  deploy-web:
    needs: [validate-and-bump, publish-release]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      service: web
      ref: ${{ needs.validate-and-bump.outputs.tag }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
